<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecofree — Project & Cash Flow Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F6F7F3;
    --surface:#FFFFFF;
    --border:#E2E6DD;
    --text:#1E2A22;
    --text-soft:#5B6B5F;
    --accent:#3F6C52;
    --accent-hover:#325A43;
    --accent-soft:#E7EFE8;
    --warn:#B9791E;
    --warn-soft:#FBF0DD;
    --danger:#A8412F;
    --danger-soft:#FBEAE6;
    --ok:#2F7A4C;
    --ok-soft:#E5F2E9;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text);
    display:flex; min-height:100vh;
  }
  aside{
    width:230px; background:var(--surface); border-right:1px solid var(--border);
    padding:24px 14px; position:sticky; top:0; height:100vh; flex-shrink:0;
  }
  .logo{ font-weight:700; font-size:20px; letter-spacing:-0.02em; padding:0 10px 22px; color:var(--accent);}
  .logo span{ font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:12px; color:var(--text-soft); display:block; letter-spacing:0.04em; text-transform:uppercase; margin-top:2px;}
  nav button{
    display:block; width:100%; text-align:left; background:none; border:none; padding:10px 12px;
    border-radius:8px; font-size:14.5px; font-weight:500; color:var(--text-soft); cursor:pointer; margin-bottom:2px;
  }
  nav button:hover{ background:var(--accent-soft); color:var(--accent);}
  nav button.active{ background:var(--accent); color:#fff;}
  main{ flex:1; padding:32px 40px; max-width:1100px;}
  h1{ font-size:22px; margin:0 0 4px;}
  .subtitle{ color:var(--text-soft); font-size:14px; margin-bottom:24px;}
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; margin-bottom:20px;}
  .card h2{ font-size:15px; margin:0 0 14px; font-weight:600;}
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px 16px; margin-bottom:14px;}
  label{ display:block; font-size:12.5px; font-weight:500; color:var(--text-soft); margin-bottom:5px;}
  input,select{
    width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:7px; font-size:14px;
    font-family:inherit; background:#fff; color:var(--text);
  }
  input:focus,select:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  .checkbox-row{ display:flex; align-items:center; gap:8px; margin-top:4px;}
  .checkbox-row input{ width:auto;}
  button.primary{
    background:var(--accent); color:#fff; border:none; padding:9px 16px; border-radius:7px;
    font-size:14px; font-weight:600; cursor:pointer;
  }
  button.primary:hover{ background:var(--accent-hover);}
  button.ghost{
    background:none; border:1px solid var(--border); padding:6px 12px; border-radius:7px;
    font-size:13px; cursor:pointer; color:var(--text);
  }
  button.ghost:hover{ background:var(--accent-soft); border-color:var(--accent);}
  table{ width:100%; border-collapse:collapse; font-size:13.5px;}
  th{ text-align:left; color:var(--text-soft); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.03em; padding:8px 10px; border-bottom:1px solid var(--border);}
  td{ padding:10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{ border-bottom:none;}
  .badge{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:600;}
  .badge.ok{ background:var(--ok-soft); color:var(--ok);}
  .badge.warn{ background:var(--warn-soft); color:var(--warn);}
  .badge.danger{ background:var(--danger-soft); color:var(--danger);}
  .badge.muted{ background:var(--accent-soft); color:var(--accent);}
  .empty{ color:var(--text-soft); font-size:13.5px; padding:16px 0;}
  .actions-cell{ display:flex; gap:6px; flex-wrap:wrap;}
  .toast{
    position:fixed; bottom:20px; right:20px; background:var(--text); color:#fff; padding:10px 16px;
    border-radius:8px; font-size:13.5px; opacity:0; transform:translateY(8px); transition:.25s; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateY(0);}
  .money{ font-family:'IBM Plex Mono',monospace; font-size:13px;}
</style>
</head>
<body>

<aside>
  <div class="logo">Ecofree<span>Projects &amp; Cash Flow</span></div>
  <nav id="nav"></nav>
</aside>

<main>
  <h1 id="page-title"></h1>
  <div class="subtitle" id="page-subtitle"></div>
  <div id="content"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const TABS = [
  { id:"tongquan", label:"Dashboard" },
  { id:"clients", label:"Clients" },
  { id:"staff", label:"Staff" },
  { id:"quotations", label:"Quotes" },
  { id:"orders", label:"Jobs" },
  { id:"invoices", label:"Invoices" },
  { id:"payouts", label:"Staff Payouts" },
  { id:"reports", label:"Reports" },
];
const PAGE_SUBTITLE = {
  tongquan: "Today's action items",
  clients: "Client records & transfer fee settings",
  staff: "Staff records & management fee rate",
  quotations: "Create quotes, approve into jobs",
  orders: "Active jobs — Fixed Price / Hourly",
  invoices: "Invoices, due dates & Day-7 payment reminders",
  payouts: "Calculate & approve staff payouts",
  reports: "Net cash flow & bad debt risk",
};

let cache = { clients: [], staff: [], quotations: [], orders: [], invoices: [], payouts: [], tasks: [], order_staff_payout: [], billing_cycles: [] };
let currentTab = "tongquan";
let selectedOrderId = null;
let editingRecord = null; // { table: 'clients', id: 3 }
let filters = {
  clients: { q: "" },
  staff: { q: "", activeOnly: false },
  quotations: { q: "", status: "" },
  orders: { q: "", status: "", type: "" },
  invoices: { q: "", status: "" },
  payouts: { q: "", status: "" },
};

function matchesText(q, ...values) {
  if (!q) return true;
  const needle = q.trim().toLowerCase();
  return values.some(v => (v || "").toString().toLowerCase().includes(needle));
}

function filterBar(tab, opts) {
  // opts: { placeholder, statusOptions: [{value,label}], typeOptions: [{value,label}] }
  const wrap = document.createElement("div");
  wrap.className = "card";
  wrap.style.padding = "12px 16px";
  wrap.style.marginBottom = "14px";
  const row = document.createElement("div");
  row.style.display = "flex"; row.style.gap = "10px"; row.style.flexWrap = "wrap"; row.style.alignItems = "center";

  const searchInput = document.createElement("input");
  searchInput.type = "text";
  searchInput.placeholder = opts.placeholder || "Search…";
  searchInput.value = filters[tab].q;
  searchInput.style.maxWidth = "260px";
  searchInput.addEventListener("input", () => { filters[tab].q = searchInput.value; renderCurrentTabOnly(); });
  row.appendChild(searchInput);

  if (opts.statusOptions) {
    const sel = document.createElement("select");
    sel.style.maxWidth = "180px";
    sel.innerHTML = `<option value="">All statuses</option>` + opts.statusOptions.map(o => `<option value="${o.value}" ${filters[tab].status===o.value?"selected":""}>${o.label}</option>`).join("");
    sel.addEventListener("change", () => { filters[tab].status = sel.value; renderCurrentTabOnly(); });
    row.appendChild(sel);
  }
  if (opts.typeOptions) {
    const sel2 = document.createElement("select");
    sel2.style.maxWidth = "180px";
    sel2.innerHTML = `<option value="">All types</option>` + opts.typeOptions.map(o => `<option value="${o.value}" ${filters[tab].type===o.value?"selected":""}>${o.label}</option>`).join("");
    sel2.addEventListener("change", () => { filters[tab].type = sel2.value; renderCurrentTabOnly(); });
    row.appendChild(sel2);
  }
  if (opts.activeOnlyToggle) {
    const label = document.createElement("label");
    label.style.display = "flex"; label.style.alignItems = "center"; label.style.gap = "6px"; label.style.fontSize = "13.5px"; label.style.fontWeight = "500"; label.style.color = "var(--text)";
    label.innerHTML = `<input type="checkbox" style="width:auto;" ${filters[tab].activeOnly?"checked":""}> Active only`;
    label.querySelector("input").addEventListener("change", (e) => { filters[tab].activeOnly = e.target.checked; renderCurrentTabOnly(); });
    row.appendChild(label);
  }
  wrap.appendChild(row);
  return wrap;
}

async function api(path, method = "GET", body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Something went wrong");
  return data;
}

function toast(msg, isError) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.background = isError ? "#A8412F" : "#1E2A22";
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2600);
}

function aud(cents) {
  if (cents === null || cents === undefined) return "—";
  return (cents / 100).toLocaleString("en-AU", { style: "currency", currency: "AUD" });
}
function toCents(audValue) {
  const n = parseFloat(audValue);
  return isNaN(n) ? 0 : Math.round(n * 100);
}
function fromCents(cents) {
  if (cents === null || cents === undefined) return "";
  return (cents / 100).toFixed(2);
}
function formatVND(vnd) {
  if (vnd === null || vnd === undefined || isNaN(vnd)) return "—";
  return Math.round(vnd).toLocaleString("vi-VN") + " ₫";
}
function daysBetween(dateStr) {
  if (!dateStr) return null;
  const d1 = new Date(dateStr + "T00:00:00");
  const d2 = new Date(new Date().toISOString().slice(0,10) + "T00:00:00");
  return Math.round((d2 - d1) / 86400000);
}
function clientName(id) {
  const c = cache.clients.find(x => x.client_id == id);
  return c ? c.company_name : "—";
}
function staffName(id) {
  const s = cache.staff.find(x => x.staff_id == id);
  return s ? s.full_name : "—";
}
function orderLabel(id) {
  const o = cache.orders.find(x => x.order_id == id);
  if (!o) return "—";
  return o.order_code + " (" + clientName(o.client_id) + ")";
}

async function loadAll() {
  const [clients, staff, quotations, orders, invoices, payouts, tasks, order_staff_payout, billing_cycles] = await Promise.all([
    api("/api/clients"), api("/api/staff"), api("/api/quotations"),
    api("/api/orders"), api("/api/invoices"), api("/api/payouts"),
    api("/api/tasks"), api("/api/order_staff_payout"), api("/api/billing_cycles"),
  ]);
  cache = { clients, staff, quotations, orders, invoices, payouts, tasks, order_staff_payout, billing_cycles };
}

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  TABS.forEach(tab => {
    const btn = document.createElement("button");
    btn.textContent = tab.label;
    btn.className = tab.id === currentTab ? "active" : "";
    btn.onclick = () => { currentTab = tab.id; render(); };
    nav.appendChild(btn);
  });
}

async function render() {
  renderNav();
  const content = document.getElementById("content");
  content.innerHTML = "<div class='empty'>Loading…</div>";
  try {
    await loadAll();
    renderCurrentTabOnly();
  } catch (e) {
    content.innerHTML = "<div class='card'><b>Failed to load data.</b><br>" + e.message +
      "<br><br>Please check: have you created the D1 database, run schema.sql, and attached the D1 binding named <code>DB</code> to the project?</div>";
  }
}

function renderCurrentTabOnly() {
  renderNav();
  document.getElementById("page-title").textContent = TABS.find(t => t.id === currentTab).label;
  document.getElementById("page-subtitle").textContent = PAGE_SUBTITLE[currentTab];
  const content = document.getElementById("content");
  content.innerHTML = "";
  const renderers = {
    tongquan: renderTongQuan, clients: renderClients, staff: renderStaff,
    quotations: renderQuotations, orders: renderOrders, invoices: renderInvoices, payouts: renderPayouts,
    reports: renderReports,
  };
  renderers[currentTab](content);
}

// ---------- TỔNG QUAN ----------
function renderTongQuan(root) {
  const needReminder = cache.invoices.filter(i => {
    if (i.status === "paid" || i.reminder_sent) return false;
    const d = daysBetween(i.sent_date);
    return d !== null && d >= 7;
  });
  const overdue = cache.invoices.filter(i => {
    if (i.status === "paid") return false;
    return i.due_date && new Date(i.due_date) < new Date(new Date().toISOString().slice(0,10));
  });

  const card1 = document.createElement("div");
  card1.className = "card";
  card1.innerHTML = "<h2>🔔 Payment Reminders Due (7 days since invoice sent)</h2>";
  if (needReminder.length === 0) {
    card1.innerHTML += "<div class='empty'>No invoices need a reminder today.</div>";
  } else {
    const tbl = buildInvoiceReminderTable(needReminder);
    card1.appendChild(tbl);
  }
  root.appendChild(card1);

  const card2 = document.createElement("div");
  card2.className = "card";
  card2.innerHTML = "<h2>⚠️ Overdue Invoices</h2>";
  if (overdue.length === 0) {
    card2.innerHTML += "<div class='empty'>No overdue invoices.</div>";
  } else {
    const rows = overdue.map(i => `<tr>
      <td>${i.invoice_code}</td><td>${clientName(i.client_id)}</td>
      <td class="money">${aud(i.total_amount_cents)}</td>
      <td>${i.due_date}</td>
      <td><span class="badge danger">Overdue</span></td>
    </tr>`).join("");
    card2.innerHTML += `<table><thead><tr><th>Invoice</th><th>Client</th><th>Total</th><th>Due Date</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  root.appendChild(card2);

  const card3 = document.createElement("div");
  card3.className = "card";
  card3.innerHTML = "<h2>⏳ Staff Payouts Pending Approval</h2>";
  const pending = cache.payouts.filter(p => p.status === "pending_approval");
  if (pending.length === 0) {
    card3.innerHTML += "<div class='empty'>No payouts pending approval.</div>";
  } else {
    const rows = pending.map(p => `<tr><td>${staffName(p.staff_id)}</td><td>${orderLabel(p.order_id)}</td><td class="money">${aud(p.net_amount_cents || p.gross_amount_cents)}</td></tr>`).join("");
    card3.innerHTML += `<table><thead><tr><th>Staff</th><th>Job</th><th>Amount</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  root.appendChild(card3);
}

function buildInvoiceReminderTable(list) {
  const wrap = document.createElement("table");
  wrap.innerHTML = "<thead><tr><th>Invoice</th><th>Client</th><th>Total</th><th>Sent Date</th><th></th></tr></thead>";
  const tbody = document.createElement("tbody");
  list.forEach(i => {
    const tr = document.createElement("tr");
    const client = cache.clients.find(c => c.client_id == i.client_id);
    const mailLink = client && client.email
      ? `<a class="ghost" style="text-decoration:none;display:inline-block;padding:6px 12px;border:1px solid var(--border);border-radius:7px;font-size:13px;" href="mailto:${client.email}?subject=Payment Reminder — Invoice ${i.invoice_code}&body=Dear ${encodeURIComponent(client.company_name)}, this is a friendly reminder that invoice ${i.invoice_code} was sent 7 days ago. Please confirm receipt and arrange payment at your earliest convenience. Thank you." target="_blank">Draft Reminder Email</a>`
      : "<span class='empty'>Client has no email on file</span>";
    tr.innerHTML = `<td>${i.invoice_code}</td><td>${clientName(i.client_id)}</td>
      <td class="money">${aud(i.total_amount_cents)}</td><td>${i.sent_date}</td>
      <td class="actions-cell">${mailLink}<button class="ghost" data-mark="${i.invoice_id}">Mark Reminder Sent</button></td>`;
    tbody.appendChild(tr);
  });
  wrap.appendChild(tbody);
  wrap.addEventListener("click", async (e) => {
    const id = e.target.getAttribute("data-mark");
    if (!id) return;
    try {
      await api("/api/invoices?id=" + id, "PUT", { reminder_sent: 1 });
      toast("Reminder marked as sent.");
      render();
    } catch (err) { toast(err.message, true); }
  });
  return wrap;
}

// ---------- KHÁCH HÀNG ----------
function renderClients(root) {
  const editing = editingRecord && editingRecord.table === "clients" ? cache.clients.find(c => c.client_id === editingRecord.id) : null;
  root.appendChild(formCard(editing ? "Edit Client: " + editing.company_name : "Add New Client", [
    { key: "client_code", label: "Client Code", type: "text", required: true, default: editing?.client_code },
    { key: "company_name", label: "Company / Contractor Name", type: "text", required: true, default: editing?.company_name },
    { key: "contact_person", label: "Contact Person", type: "text", default: editing?.contact_person },
    { key: "email", label: "Email", type: "email", default: editing?.email },
    { key: "phone", label: "Phone Number", type: "text", default: editing?.phone },
    { key: "default_fee_mode", label: "Transfer Fee (Default)", type: "select",
      options: ["client","ecofree","none"],
      labels: { client: "Client Pays 5%", ecofree: "Ecofree Pays 5%", none: "No Fee (Direct Bank Transfer)" },
      default: editing?.default_fee_mode || (editing?.client_pays_fee_default ? "client" : editing ? "ecofree" : "client") },
  ], async (data) => {
    if (editing) {
      await api("/api/clients?id=" + editing.client_id, "PUT", data);
      toast("Client updated."); editingRecord = null; render();
    } else {
      await api("/api/clients", "POST", data);
      toast("Client added."); render();
    }
  }, null,
  { editing: !!editing, submitLabel: editing ? "Update" : "Save", onCancel: editing ? () => { editingRecord = null; render(); } : null }));

  root.appendChild(filterBar("clients", { placeholder: "Search by code, company, contact, email…" }));

  const list = cache.clients.filter(c => matchesText(filters.clients.q, c.client_code, c.company_name, c.contact_person, c.email, c.phone));
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = "<h2>Client List</h2>";
  if (cache.clients.length === 0) {
    card.innerHTML += "<div class='empty'>No clients yet.</div>";
  } else if (list.length === 0) {
    card.innerHTML += "<div class='empty'>No clients match your filter.</div>";
  } else {
    const feeBadge = (c) => {
      const mode = c.default_fee_mode || (c.client_pays_fee_default ? "client" : "ecofree");
      if (mode === "client") return "<span class='badge muted'>Client Pays 5%</span>";
      if (mode === "none") return "<span class='badge ok'>No Fee</span>";
      return "<span class='badge muted'>Ecofree Pays 5%</span>";
    };
    const rows = list.map(c => `<tr>
      <td>${c.client_code}</td><td>${c.company_name}</td><td>${c.contact_person || "—"}</td>
      <td>${c.email || "—"}</td><td>${c.phone || "—"}</td>
      <td>${feeBadge(c)}</td>
      <td><button class="ghost" data-edit="${c.client_id}">Edit</button></td>
    </tr>`).join("");
    card.innerHTML += `<table><thead><tr><th>Code</th><th>Company</th><th>Contact</th><th>Email</th><th>Phone</th><th>Default Fee</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  root.appendChild(card);
  card.addEventListener("click", (e) => {
    const id = e.target.getAttribute("data-edit");
    if (!id) return;
    editingRecord = { table: "clients", id: parseInt(id) };
    render();
  });
}

// ---------- NHÂN VIÊN ----------
function renderStaff(root) {
  const editing = editingRecord && editingRecord.table === "staff" ? cache.staff.find(s => s.staff_id === editingRecord.id) : null;
  root.appendChild(formCard(editing ? "Edit Staff: " + editing.full_name : "Add New Staff", [
    { key: "staff_code", label: "Staff Code", type: "text", required: true, default: editing?.staff_code },
    { key: "full_name", label: "Full Name", type: "text", required: true, default: editing?.full_name },
    { key: "role", label: "Position", type: "select", options: ["estimator","drafter","admin","marketing"], labels:{estimator:"Estimator",drafter:"Drafter",admin:"Admin",marketing:"Marketing"}, default: editing?.role },
    { key: "avg_hourly_rate_aud", label: "Avg. Hourly Rate (AUD)", type: "number", step: "0.01", default: editing ? fromCents(editing.avg_hourly_rate_cents) : undefined },
    { key: "management_fee_rate_pct", label: "Management Fee Rate (%)", type: "number", step: "0.1", min: "0", max: "100",
      default: editing ? (editing.management_fee_rate_pct ?? editing.management_fee_rate) : 20 },
    { key: "user_role", label: "System Role", type: "select", options: ["member","accountant","manager"], labels:{member:"Member",accountant:"Accountant",manager:"Manager"}, default: editing?.user_role },
  ], async (data) => {
    data.avg_hourly_rate_cents = toCents(data.avg_hourly_rate_aud); delete data.avg_hourly_rate_aud;
    if (editing) {
      data.is_active = data.is_active ? 1 : 0;
      await api("/api/staff?id=" + editing.staff_id, "PUT", data);
      toast("Staff updated."); editingRecord = null; render();
    } else {
      data.is_active = 1;
      await api("/api/staff", "POST", data);
      toast("Staff added."); render();
    }
  }, editing ? [{ key: "is_active", label: "Currently active (uncheck if no longer working here)", checked: editing.is_active }] : null,
  { editing: !!editing, submitLabel: editing ? "Update" : "Save", onCancel: editing ? () => { editingRecord = null; render(); } : null }));

  root.appendChild(filterBar("staff", { placeholder: "Search by code, name, position…", activeOnlyToggle: true }));

  let list = cache.staff.filter(s => matchesText(filters.staff.q, s.staff_code, s.full_name, s.role));
  if (filters.staff.activeOnly) list = list.filter(s => s.is_active);
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = "<h2>Staff List</h2>";
  if (cache.staff.length === 0) {
    card.innerHTML += "<div class='empty'>No staff yet.</div>";
  } else if (list.length === 0) {
    card.innerHTML += "<div class='empty'>No staff match your filter.</div>";
  } else {
    const rows = list.map(s => `<tr>
      <td>${s.staff_code}</td><td>${s.full_name}${s.is_active ? "" : " <span class='badge muted'>Inactive</span>"}</td><td>${s.role}</td>
      <td class="money">${aud(s.avg_hourly_rate_cents)}/hr</td>
      <td>${s.management_fee_rate_pct ?? s.management_fee_rate}%</td><td>${s.user_role}</td>
      <td><button class="ghost" data-edit="${s.staff_id}">Edit</button></td>
    </tr>`).join("");
    card.innerHTML += `<table><thead><tr><th>Code</th><th>Name</th><th>Position</th><th>Avg. Rate</th><th>Mgmt Fee %</th><th>Role</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  root.appendChild(card);
  card.addEventListener("click", (e) => {
    const id = e.target.getAttribute("data-edit");
    if (!id) return;
    editingRecord = { table: "staff", id: parseInt(id) };
    render();
  });
}

// ---------- BÁO GIÁ ----------
function renderQuotations(root) {
  if (cache.clients.length === 0) {
    root.appendChild(warnCard("You need to add at least 1 Client before creating a Quote."));
  }
  const editing = editingRecord && editingRecord.table === "quotations" ? cache.quotations.find(q => q.quotation_id === editingRecord.id) : null;
  if (editing && editing.status === "approved") {
    root.appendChild(warnCard("This quote has already been approved into a Job — editing it here will NOT update the existing job. To change the job's figures, edit it directly on the Jobs tab."));
  }
  root.appendChild(formCard(editing ? "Edit Quote: " + editing.quotation_code : "Create New Quote", [
    { key: "quotation_code", label: "Quote Code", type: "text", required: true, default: editing?.quotation_code },
    { key: "client_id", label: "Client", type: "select", options: cache.clients.map(c=>c.client_id), labels: Object.fromEntries(cache.clients.map(c=>[c.client_id,c.company_name])), required: true, default: editing?.client_id },
    { key: "project_name", label: "Project Name", type: "text", required: true, default: editing?.project_name },
    { key: "created_date", label: "Date Created", type: "date", default: editing?.created_date || new Date().toISOString().slice(0,10) },
    { key: "valid_until", label: "Quote Valid Until", type: "date", default: editing?.valid_until },
    { key: "contract_type", label: "Contract Type", type: "select", options: ["fixed","hourly"], labels:{fixed:"Fixed Price",hourly:"Hourly"}, default: editing?.contract_type },
    { key: "fee_mode", label: "Transfer Fee", type: "select", options: ["","client","ecofree","none"],
      labels:{"":"(Use Client default)",client:"Client Pays 5%",ecofree:"Ecofree Pays 5%",none:"No Fee (Direct Bank Transfer)"},
      default: editing?.fee_mode || editing?.fee_payer },
    { key: "total_amount_aud", label: "Quoted Amount (AUD)", type: "number", step:"0.01", default: editing ? fromCents(editing.total_amount_cents) : undefined },
    { key: "notes", label: "Notes (project pricing notes — will carry over to the Job when approved)", type: "textarea", default: editing?.notes },
  ], async (data) => {
    data.total_amount_cents = toCents(data.total_amount_aud); delete data.total_amount_aud;
    if (!data.fee_mode) {
      const c = cache.clients.find(x => x.client_id == data.client_id);
      data.fee_mode = (c && (c.default_fee_mode || (c.client_pays_fee_default ? "client" : "ecofree"))) || "client";
    }
    if (editing) {
      await api("/api/quotations?id=" + editing.quotation_id, "PUT", data);
      toast("Quote updated."); editingRecord = null; render();
    } else {
      data.status = "sent";
      await api("/api/quotations", "POST", data);
      toast("Quote created."); render();
    }
  }, null, { editing: !!editing, submitLabel: editing ? "Update" : "Save", onCancel: editing ? () => { editingRecord = null; render(); } : null }));

  root.appendChild(filterBar("quotations", {
    placeholder: "Search by code, project name, client…",
    statusOptions: [
      { value: "draft", label: "Draft" }, { value: "sent", label: "Sent" },
      { value: "approved", label: "Approved" }, { value: "rejected", label: "Rejected" },
    ],
  }));

  let list = cache.quotations.filter(q => matchesText(filters.quotations.q, q.quotation_code, q.project_name, clientName(q.client_id)));
  if (filters.quotations.status) list = list.filter(q => q.status === filters.quotations.status);

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = "<h2>Quote List</h2>";
  if (cache.quotations.length === 0) {
    card.innerHTML += "<div class='empty'>No quotes yet.</div>";
  } else if (list.length === 0) {
    card.innerHTML += "<div class='empty'>No quotes match your filter.</div>";
  } else {
    const tbl = document.createElement("table");
    tbl.innerHTML = "<thead><tr><th>Code</th><th>Client</th><th>Project</th><th>Type</th><th>Amount</th><th>Status</th><th></th></tr></thead>";
    const tbody = document.createElement("tbody");
    list.forEach(q => {
      const tr = document.createElement("tr");
      const statusBadge = q.status === "approved" ? "<span class='badge ok'>Approved</span>" : "<span class='badge muted'>" + q.status + "</span>";
      const approveBtn = q.status !== "approved" ? `<button class="primary" data-approve="${q.quotation_id}">Approve → Create Job</button>` : "";
      tr.innerHTML = `<td>${q.quotation_code}</td><td>${clientName(q.client_id)}</td><td>${q.project_name}</td>
        <td>${q.contract_type === "fixed" ? "Fixed Price" : "Hourly"}</td>
        <td class="money">${aud(q.total_amount_cents)}</td><td>${statusBadge}</td>
        <td class="actions-cell">${approveBtn}<button class="ghost" data-edit="${q.quotation_id}">Edit</button></td>`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    tbl.addEventListener("click", async (e) => {
      const approveId = e.target.getAttribute("data-approve");
      const editId = e.target.getAttribute("data-edit");
      if (approveId) {
        const order_code = window.prompt("Enter the Job Code for the new job:", "");
        if (!order_code) { toast("You must enter a Job Code to continue.", true); return; }
        try {
          const res = await api("/api/approve-quotation", "POST", { quotation_id: parseInt(approveId), order_code });
          toast("Job created: " + res.order_code);
          render();
        } catch (err) { toast(err.message, true); }
      }
      if (editId) { editingRecord = { table: "quotations", id: parseInt(editId) }; render(); }
    });
    card.appendChild(tbl);
  }
  root.appendChild(card);
}

// ---------- ĐƠN HÀNG ----------
function renderOrders(root) {
  root.appendChild(filterBar("orders", {
    placeholder: "Search by code, client…",
    statusOptions: [{ value: "in_progress", label: "In Progress" }, { value: "completed", label: "Completed" }],
    typeOptions: [{ value: "fixed", label: "Fixed Price" }, { value: "hourly", label: "Hourly" }],
  }));

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = "<h2>Jobs</h2>";
  if (cache.orders.length === 0) {
    card.innerHTML += "<div class='empty'>No jobs yet — approve a Quote to create one.</div>";
    root.appendChild(card);
    return;
  }
  let list = cache.orders.filter(o => matchesText(filters.orders.q, o.order_code, clientName(o.client_id)));
  if (filters.orders.status) list = list.filter(o => o.status === filters.orders.status);
  if (filters.orders.type) list = list.filter(o => o.contract_type === filters.orders.type);

  if (list.length === 0) {
    card.innerHTML += "<div class='empty'>No jobs match your filter.</div>";
    root.appendChild(card);
    return;
  }
  const rows = list.map(o => `<tr>
    <td style="cursor:pointer;${selectedOrderId==o.order_id?'background:var(--accent-soft);':''}" data-select="${o.order_id}">${o.order_code}</td>
    <td data-select="${o.order_id}" style="cursor:pointer;">${clientName(o.client_id)}</td>
    <td data-select="${o.order_id}" style="cursor:pointer;">${o.contract_type === "fixed" ? "Fixed Price" : "Hourly"}</td>
    <td data-select="${o.order_id}" style="cursor:pointer;">${o.start_date || "—"}</td>
    <td data-select="${o.order_id}" style="cursor:pointer;">${o.deadline || "—"}</td>
    <td data-select="${o.order_id}" style="cursor:pointer;"><span class="badge ${o.status === "completed" ? "ok" : "muted"}">${o.status === "completed" ? "Completed" : "In Progress"}</span></td>
    <td><button class="ghost" data-edit="${o.order_id}">Edit</button></td>
  </tr>`).join("");
  card.innerHTML += `<table><thead><tr><th>Code</th><th>Client</th><th>Type</th><th>Start Date</th><th>Deadline</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
  root.appendChild(card);
  card.querySelector("table").addEventListener("click", (e) => {
    const editId = e.target.getAttribute("data-edit");
    if (editId) { editingRecord = { table: "orders", id: parseInt(editId) }; selectedOrderId = parseInt(editId); render(); return; }
    const selId = e.target.getAttribute("data-select");
    if (selId) { selectedOrderId = parseInt(selId); render(); }
  });

  if (!selectedOrderId) {
    root.appendChild(infoNote("👆 Select a job above to enter details (hours worked / staff pay)."));
    return;
  }
  const order = cache.orders.find(o => o.order_id === selectedOrderId);
  if (!order) { selectedOrderId = null; return; }

  const detailHeader = document.createElement("div");
  detailHeader.innerHTML = `<h1 style="font-size:17px;margin-top:24px;">Job Details: ${order.order_code} — ${clientName(order.client_id)}${order.project_name ? " — " + order.project_name : ""}</h1>`;
  root.appendChild(detailHeader);

  // Ô tổng giá trị đã báo giá — dùng chung cho cả 2 loại hợp đồng, để đối chiếu không vượt báo giá
  const quotedTotal = order.total_amount_cents || 0;
  const usedTotal = order.contract_type === "hourly"
    ? cache.tasks.filter(t => t.order_id === order.order_id).reduce((s, t) => s + Math.round((t.hours||0) * t.client_rate_cents), 0)
    : cache.order_staff_payout.filter(x => x.order_id === order.order_id).reduce((s, x) => s + x.fixed_amount_cents, 0);
  const pct = quotedTotal > 0 ? Math.round((usedTotal / quotedTotal) * 100) : 0;
  const overBudget = quotedTotal > 0 && usedTotal > quotedTotal;
  const budgetCard = document.createElement("div");
  budgetCard.className = "card";
  budgetCard.style.borderColor = overBudget ? "var(--danger)" : "var(--border)";
  budgetCard.innerHTML = `<h2>Total Quoted Amount</h2>
    <div class="grid">
      <div><label>Quoted Amount</label><div class="money" style="font-size:16px;font-weight:600;">${aud(quotedTotal)}</div></div>
      <div><label>${order.contract_type === "hourly" ? "Allocated to Tasks" : "Allocated to Staff"}</label>
        <div class="money" style="font-size:16px;font-weight:600;${overBudget?'color:var(--danger);':''}">${aud(usedTotal)} (${pct}%)</div></div>
    </div>
    ${overBudget ? "<div class='badge danger'>⚠️ Exceeds the quoted amount!</div>" : ""}
    ${order.notes ? `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:13.5px;"><b>Notes from quote:</b> ${order.notes}</div>` : ""}`;
  root.appendChild(budgetCard);

  const editingOrder = editingRecord && editingRecord.table === "orders" && editingRecord.id === order.order_id;
  if (editingOrder) {
    root.appendChild(formCard("Edit Job Details", [
      { key: "order_code", label: "Job Code", type: "text", required: true, default: order.order_code },
      { key: "project_name", label: "Project Name", type: "text", default: order.project_name },
      { key: "total_amount_aud", label: "Quoted Amount (AUD)", type: "number", step:"0.01", default: fromCents(order.total_amount_cents) },
      { key: "deadline", label: "Handover Deadline", type: "date", default: order.deadline },
      { key: "estimated_hours", label: "Estimated Hours (used for bad-debt calculation)", type: "number", step:"0.25", default: order.estimated_hours },
      { key: "rate_estimated", label: "Estimated Exchange Rate (AUD/VND)", type: "number", step:"0.01", default: order.rate_estimated },
      { key: "status", label: "Status", type: "select", options: ["in_progress","completed"], labels:{in_progress:"In Progress",completed:"Completed"}, default: order.status },
      { key: "notes", label: "Notes", type: "textarea", default: order.notes },
    ], async (data) => {
      data.total_amount_cents = toCents(data.total_amount_aud); delete data.total_amount_aud;
      await api("/api/orders?id=" + order.order_id, "PUT", data);
      toast("Job updated."); editingRecord = null; render();
    }, null, { editing: true, submitLabel: "Update", onCancel: () => { editingRecord = null; render(); } }));
  }

  if (order.contract_type === "fixed") renderFixedOrderDetail(root, order);
  else renderHourlyOrderDetail(root, order);
}

function renderFixedOrderDetail(root, order) {
  // Phần 1: Trả lương cố định theo từng nhân viên (dùng để tính thù lao)
  root.appendChild(formCard("Add Staff & Fixed Pay", [
    { key: "staff_id", label: "Staff Member", type: "select", options: cache.staff.map(s=>s.staff_id), labels: Object.fromEntries(cache.staff.map(s=>[s.staff_id,s.full_name])), required: true },
    { key: "fixed_amount_aud", label: "Fixed Pay (AUD)", type: "number", step:"0.01", required: true },
    { key: "delivered_date", label: "Delivery Date", type: "date" },
  ], async (data) => {
    data.order_id = order.order_id;
    data.fixed_amount_cents = toCents(data.fixed_amount_aud); delete data.fixed_amount_aud;
    data.completed = 0;
    await api("/api/order_staff_payout", "POST", data);
    toast("Added."); render();
  }));

  const list = cache.order_staff_payout.filter(x => x.order_id === order.order_id);
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = "<h2>Staff & Pay for This Job</h2>";
  if (list.length === 0) {
    card.innerHTML += "<div class='empty'>No staff yet.</div>";
  } else {
    const tbl = document.createElement("table");
    tbl.innerHTML = "<thead><tr><th>Staff</th><th>Pay</th><th>Delivered</th><th>Completed</th><th></th></tr></thead>";
    const tbody = document.createElement("tbody");
    list.forEach(x => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${staffName(x.staff_id)}</td><td class="money">${aud(x.fixed_amount_cents)}</td>
        <td>${x.delivered_date || "—"}</td>
        <td>${x.completed ? "<span class='badge ok'>Completed</span>" : "<span class='badge muted'>In Progress</span>"}</td>
        <td>${x.completed ? "—" : `<button class="ghost" data-done="${x.id}">Mark Complete</button>`}</td>`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    tbl.addEventListener("click", async (e) => {
      const id = e.target.getAttribute("data-done");
      if (!id) return;
      try {
        await api("/api/order_staff_payout?id=" + id, "PUT", { completed: 1 });
        toast("Marked complete.");
        // Kiểm tra: nếu TẤT CẢ nhân viên trong đơn đã hoàn thành -> tự tạo Hóa đơn nháp
        const res = await api("/api/check-fixed-order-invoice", "POST", { order_id: order.order_id });
        if (res.created) toast(`Draft invoice ${res.invoice_code} auto-created — go to the Invoices tab to finish it.`);
        render();
      } catch (err) { toast(err.message, true); }
    });
    card.appendChild(tbl);
  }
  root.appendChild(card);
  root.appendChild(infoNote("When ALL staff on this job are marked Complete, the system auto-creates a draft invoice on the Invoices tab (using the Quoted Amount above)."));

  // Phần 2: Danh sách nhiệm vụ chung trong dự án (chỉ để theo dõi công việc, không dùng để tính tiền —
  // vì Trọn gói tính theo tiền công cố định ở Phần 1, không tính theo giờ)
  renderTaskTrackerSection(root, order, { showRates: false });
}

// Dùng chung cho cả Loại A (chỉ theo dõi công việc, showRates=false) và Loại B (tính tiền, showRates=true)
function renderTaskTrackerSection(root, order, opts) {
  const showRates = opts && opts.showRates;
  const editingTask = editingRecord && editingRecord.table === "tasks"
    ? cache.tasks.find(t => t.task_id === editingRecord.id && t.order_id === order.order_id)
    : null;

  const fields = [
    { key: "task_name", label: "Task Name", type: "text", required: true, default: editingTask?.task_name },
    { key: "staff_id", label: "Staff Member", type: "select", options: cache.staff.map(s=>s.staff_id), labels: Object.fromEntries(cache.staff.map(s=>[s.staff_id,s.full_name])), required: true, default: editingTask?.staff_id },
  ];
  if (showRates) {
    fields.push(
      { key: "hours", label: "Hours Worked", type: "number", step:"0.25", default: editingTask?.hours },
      { key: "client_rate_aud", label: "Client Bill Rate /hr (AUD)", type: "number", step:"0.01", default: editingTask ? fromCents(editingTask.client_rate_cents) : undefined },
      { key: "staff_rate_aud", label: "Staff Pay Rate /hr (AUD)", type: "number", step:"0.01", default: editingTask ? fromCents(editingTask.staff_rate_cents) : undefined },
    );
  } else {
    fields.push({ key: "hours", label: "Hours Worked (reference only — not used for billing)", type: "number", step:"0.25", default: editingTask?.hours });
  }
  if (editingTask) {
    fields.push({ key: "status", label: "Status", type: "select", options: ["in_progress","completed"], labels:{in_progress:"In Progress",completed:"Completed"}, default: editingTask.status });
  }

  if (editingTask && editingTask.billing_cycle_id) {
    root.appendChild(warnCard(`This task is already included in Progress Claim #${editingTask.billing_cycle_id}. Editing it here will NOT update the invoice already generated from that claim — you'll need to edit the invoice directly on the Invoices tab if needed.`));
  }

  root.appendChild(formCard(editingTask ? "Edit Task: " + editingTask.task_name : "Add New Task", fields, async (data) => {
    if (showRates) {
      data.client_rate_cents = toCents(data.client_rate_aud); delete data.client_rate_aud;
      data.staff_rate_cents = toCents(data.staff_rate_aud); delete data.staff_rate_aud;
    } else {
      data.client_rate_cents = 0; data.staff_rate_cents = 0;
    }
    if (editingTask) {
      await api("/api/tasks?id=" + editingTask.task_id, "PUT", data);
      toast("Task updated."); editingRecord = null; render();
    } else {
      data.order_id = order.order_id;
      data.status = "in_progress";
      await api("/api/tasks", "POST", data);
      toast("Task added."); render();
    }
  }, null, editingTask ? { editing: true, submitLabel: "Update", onCancel: () => { editingRecord = null; render(); } } : undefined));

  const tasks = cache.tasks.filter(t => t.order_id === order.order_id);
  const taskCard = document.createElement("div");
  taskCard.className = "card";
  taskCard.innerHTML = "<h2>Project Task List</h2>";
  if (tasks.length === 0) {
    taskCard.innerHTML += "<div class='empty'>No tasks yet.</div>";
  } else {
    const tbl = document.createElement("table");
    const rateHeaders = showRates ? "<th>Client Amount</th><th>Staff Amount</th>" : "";
    tbl.innerHTML = `<thead><tr><th>Task</th><th>Staff</th><th>Hours</th>${rateHeaders}<th>Status</th>${showRates?"<th>Progress Claim</th>":""}<th></th></tr></thead>`;
    const tbody = document.createElement("tbody");
    tasks.forEach(t => {
      const tr = document.createElement("tr");
      const rateCells = showRates ? `<td class="money">${aud(Math.round((t.hours||0)*t.client_rate_cents))}</td><td class="money">${aud(Math.round((t.hours||0)*t.staff_rate_cents))}</td>` : "";
      const cycleCell = showRates ? `<td>${t.billing_cycle_id ? "<span class='badge muted'>Claimed #"+t.billing_cycle_id+"</span>" : "—"}</td>` : "";
      const completeBtn = t.status !== "completed" ? `<button class="ghost" data-donetask="${t.task_id}">Mark Complete</button>` : "";
      tr.innerHTML = `<td>${t.task_name}</td><td>${staffName(t.staff_id)}</td><td>${t.hours ?? "—"}</td>${rateCells}
        <td>${t.status === "completed" ? "<span class='badge ok'>Completed</span>" : "<span class='badge muted'>In Progress</span>"}</td>
        ${cycleCell}
        <td class="actions-cell">${completeBtn}<button class="ghost" data-edittask="${t.task_id}">Edit</button></td>`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    tbl.addEventListener("click", async (e) => {
      const doneId = e.target.getAttribute("data-donetask");
      const editId = e.target.getAttribute("data-edittask");
      if (doneId) {
        try { await api("/api/tasks?id=" + doneId, "PUT", { status: "completed" }); toast("Marked complete."); render(); }
        catch (err) { toast(err.message, true); }
      }
      if (editId) { editingRecord = { table: "tasks", id: parseInt(editId) }; render(); }
    });
    taskCard.appendChild(tbl);
  }
  root.appendChild(taskCard);
}

function renderHourlyOrderDetail(root, order) {
  renderTaskTrackerSection(root, order, { showRates: true });

  const closeCard = document.createElement("div");
  closeCard.className = "card";
  closeCard.innerHTML = `<h2>Progress Claim</h2>
    <div class="grid">
      <div><label>From</label><input type="date" id="cycle-from"></div>
      <div><label>To</label><input type="date" id="cycle-to" value="${new Date().toISOString().slice(0,10)}"></div>
    </div>
    <button class="primary" id="close-cycle-btn">Submit Progress Claim (collects completed, unclaimed tasks)</button>`;
  root.appendChild(closeCard);
  closeCard.querySelector("#close-cycle-btn").addEventListener("click", async () => {
    const period_start = document.getElementById("cycle-from").value;
    const period_end = document.getElementById("cycle-to").value;
    if (!period_start || !period_end) { toast("Please select a date range.", true); return; }
    try {
      const res = await api("/api/close-billing-cycle", "POST", { order_id: order.order_id, period_start, period_end });
      toast(`Progress Claim #${res.cycle_id} submitted — ${res.task_count} task(s), draft invoice ${res.invoice_code} auto-created.`);
      render();
    } catch (err) { toast(err.message, true); }
  });

  const cycles = cache.billing_cycles.filter(c => c.order_id === order.order_id);
  const cyclesCard = document.createElement("div");
  cyclesCard.className = "card";
  cyclesCard.innerHTML = "<h2>Progress Claim History</h2>";
  if (cycles.length === 0) {
    cyclesCard.innerHTML += "<div class='empty'>No progress claims yet.</div>";
  } else {
    const rows = cycles.map(c => `<tr>
      <td>#${c.cycle_id}</td><td>${c.period_start} → ${c.period_end}</td>
      <td class="money">${aud(c.total_client_amount_cents)}</td>
      <td class="money">${aud(c.total_staff_amount_cents)}</td>
      <td>${c.invoice_id ? "<span class='badge ok'>Invoice #"+c.invoice_id+" created</span>" : "<span class='badge warn'>No invoice yet</span>"}</td>
    </tr>`).join("");
    cyclesCard.innerHTML += `<table><thead><tr><th>Claim #</th><th>Period</th><th>Client Amount</th><th>Staff Amount</th><th>Invoice</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  root.appendChild(cyclesCard);
  root.appendChild(infoNote("Each time you submit a Progress Claim, the system auto-generates a draft invoice on the Invoices tab — just review it, set the Sent Date, and export the PDF to send to your client."));
}

// ---------- HÓA ĐƠN ----------
function renderInvoices(root) {
  const editing = editingRecord && editingRecord.table === "invoices" ? cache.invoices.find(i => i.invoice_id === editingRecord.id) : null;

  if (!editing) {
    root.appendChild(infoNote("ℹ️ Invoices are no longer created manually here — they're auto-generated when you submit a Progress Claim (Hourly jobs) or mark all staff Complete (Fixed Price jobs) on the Jobs tab. Just review, set the Sent Date, and export the PDF."));
  } else {
    root.appendChild(warnCard("Editing an existing invoice. If you change the Status to 'Paid' here, the system will still auto-generate the matching Staff Payout, just like using the 'Mark as Paid' button."));
    root.appendChild(formCard("Edit Invoice: " + editing.invoice_code, [

      { key: "base_amount_aud", label: "Subtotal (AUD)", type: "number", step:"0.01", default: fromCents(editing.base_amount_cents) },
      { key: "transfer_fee_aud", label: "Additional Transfer Fee (AUD)", type: "number", step:"0.01", default: fromCents(editing.transfer_fee_cents) },
      { key: "sent_date", label: "Sent Date", type: "date", default: editing.sent_date },
      { key: "due_date", label: "Due Date", type: "date", default: editing.due_date },
      { key: "paid_date", label: "Payment Received Date", type: "date", default: editing.paid_date },
      { key: "status", label: "Status", type: "select", options: ["delivered_pending","sent_within_terms","overdue","paid"],
        labels:{delivered_pending:"Draft (Pending)",sent_within_terms:"Sent (Current)",overdue:"Overdue",paid:"Paid"}, default: editing.status },
    ], async (data) => {
      data.base_amount_cents = toCents(data.base_amount_aud); delete data.base_amount_aud;
      data.transfer_fee_cents = toCents(data.transfer_fee_aud); delete data.transfer_fee_aud;
      data.total_amount_cents = data.base_amount_cents + data.transfer_fee_cents;
      await api("/api/invoices?id=" + editing.invoice_id, "PUT", data);
      toast("Invoice updated."); editingRecord = null; render();
    }, [{ key: "reminder_sent", label: "Day-7 reminder sent", checked: editing.reminder_sent }],
    { editing: true, submitLabel: "Update", onCancel: () => { editingRecord = null; render(); } }));
  }

  root.appendChild(filterBar("invoices", {
    placeholder: "Search by invoice code, client…",
    statusOptions: [
      { value: "delivered_pending", label: "Pending" }, { value: "sent_within_terms", label: "Current" },
      { value: "overdue", label: "Overdue" }, { value: "paid", label: "Paid" },
    ],
  }));

  let list = cache.invoices.filter(i => matchesText(filters.invoices.q, i.invoice_code, clientName(i.client_id)));
  if (filters.invoices.status) list = list.filter(i => i.status === filters.invoices.status);

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = "<h2>Invoice List</h2>";
  if (cache.invoices.length === 0) {
    card.innerHTML += "<div class='empty'>No invoices yet — created automatically when you submit a Progress Claim (Jobs tab).</div>";
  } else if (list.length === 0) {
    card.innerHTML += "<div class='empty'>No invoices match your filter.</div>";
  } else {
    const tbl = document.createElement("table");
    tbl.innerHTML = "<thead><tr><th>Code</th><th>Client</th><th>Total</th><th>Sent</th><th>Due</th><th>Status</th><th></th></tr></thead>";
    const tbody = document.createElement("tbody");
    list.forEach(i => {
      const tr = document.createElement("tr");
      let statusBadge;
      if (i.status === "paid") statusBadge = "<span class='badge ok'>Paid</span>";
      else if (i.due_date && new Date(i.due_date) < new Date(new Date().toISOString().slice(0,10))) statusBadge = "<span class='badge danger'>Overdue</span>";
      else statusBadge = "<span class='badge muted'>Current</span>";
      const d = daysBetween(i.sent_date);
      const remindBadge = (!i.reminder_sent && d !== null && d >= 7 && i.status !== "paid") ? " <span class='badge warn'>Reminder Due</span>" : "";
      const payBtn = i.status !== "paid" ? `<button class="ghost" data-pay="${i.invoice_id}">Mark as Paid</button>` : "";
      tr.innerHTML = `<td>${i.invoice_code}</td><td>${clientName(i.client_id)}</td>
        <td class="money">${aud(i.total_amount_cents)}</td><td>${i.sent_date || "—"}</td><td>${i.due_date || "—"}</td>
        <td>${statusBadge}${remindBadge}</td>
        <td class="actions-cell">${payBtn}<button class="ghost" data-edit="${i.invoice_id}">Edit</button><button class="ghost" data-pdf="${i.invoice_id}">📄 Preview PDF</button></td>`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    tbl.addEventListener("click", async (e) => {
      const payId = e.target.getAttribute("data-pay");
      const editId = e.target.getAttribute("data-edit");
      const pdfId = e.target.getAttribute("data-pdf");
      if (payId) {
        try {
          await api("/api/invoices?id=" + payId, "PUT", { status: "paid", paid_date: new Date().toISOString().slice(0,10) });
          toast("Marked as paid. The matching payout will be auto-created on the Staff Payouts tab.");
          render();
        } catch (err) { toast(err.message, true); }
      }
      if (editId) { editingRecord = { table: "invoices", id: parseInt(editId) }; render(); }
      if (pdfId) {
        try { toast("Preparing preview…"); await previewInvoicePDF(parseInt(pdfId)); }
        catch (err) { toast(err.message, true); }
      }
    });
    card.appendChild(tbl);
  }
  root.appendChild(card);
}

async function buildInvoiceDoc(invoiceId) {
  const d = await api("/api/invoice-detail?id=" + invoiceId);
  const inv = d.invoice;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });

  const L = 14, R = 196;
  const LABEL_X = L, VALUE_X = 45;
  let y = 20;

  function row(label, value, opts) {
    doc.setFont("helvetica", "bold"); doc.setFontSize(9.5); doc.setTextColor(0);
    doc.text(label, LABEL_X, y);
    doc.setFont("helvetica", (opts && opts.boldValue) ? "bold" : "normal");
    doc.text(String(value ?? "-"), VALUE_X, y);
    y += 5.5;
  }
  function sectionHeader(title) {
    y += 3;
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(0);
    doc.text(title, L, y);
    y += 6;
  }

  // ---- Title ----
  doc.setFont("helvetica", "bold"); doc.setFontSize(24);
  doc.text("INVOICE", L, y); y += 10;

  row("Invoice No.", inv.invoice_code);
  row("Invoice Date", inv.sent_date || "-");
  row("Due Date", inv.due_date || "-");

  // ---- From (thông tin cố định của người gửi) ----
  sectionHeader("From");
  row("Name", SENDER_INFO.name);
  row("Address", SENDER_INFO.address);
  row("Phone", SENDER_INFO.phone);
  row("Email", SENDER_INFO.email);

  // ---- Bill to (khách hàng) ----
  sectionHeader("Bill to");
  row("Company", d.client_name);
  row("Email", d.client_email);
  if (d.project_name) row("Project", d.project_name);

  // ---- Bảng công việc: No | Description | Hour | Price($) | Amount($) ----
  y += 4;
  const colNo = L, colDesc = L + 10, colHour = 130, colPrice = 158, colAmount = R;
  doc.setFillColor(240, 240, 240);
  doc.rect(L, y - 5, R - L, 7.5, "F");
  doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(60);
  doc.text("No", colNo, y);
  doc.text("Description", colDesc, y);
  doc.text("Hour", colHour, y, { align: "right" });
  doc.text("Price($)", colPrice, y, { align: "right" });
  doc.text("Amount($)", colAmount, y, { align: "right" });
  y += 7;

  doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(0);
  d.line_items.forEach((li, idx) => {
    const name = String(li.task_name || "-");
    doc.text(String(idx + 1), colNo, y);
    doc.text(name.length > 45 ? name.slice(0, 42) + "..." : name, colDesc, y);
    doc.text(li.hours !== null && li.hours !== undefined ? String(li.hours) : "-", colHour, y, { align: "right" });
    doc.text(li.rate_cents !== null && li.rate_cents !== undefined ? "$" + (li.rate_cents/100).toFixed(2) : "-", colPrice, y, { align: "right" });
    doc.text("$" + (li.amount_cents/100).toFixed(2), colAmount, y, { align: "right" });
    y += 6.5;
  });

  // Phí chuyển đổi (chỉ hiện nếu > 0, theo đúng logic Khách hàng chịu phí)
  if (inv.transfer_fee_cents > 0) {
    doc.text("Transfer Fee (5%)", colDesc, y);
    doc.text("$" + (inv.transfer_fee_cents/100).toFixed(2), colAmount, y, { align: "right" });
    y += 6.5;
  }

  doc.setDrawColor(0); doc.setLineWidth(0.3);
  doc.line(L, y, R, y); y += 7;

  doc.setFont("helvetica", "bold"); doc.setFontSize(12);
  doc.text("Total Amount", colDesc, y);
  doc.text("$" + (inv.total_amount_cents/100).toFixed(2), colAmount, y, { align: "right" });
  y += 12;

  // ---- Bank deposit (thông tin cố định) ----
  sectionHeader("Bank deposit");
  row("Account Holder Name", BANK_INFO.accountHolder);
  row("Bank Name", BANK_INFO.bankName);
  row("Bank Address", BANK_INFO.bankAddress);
  row("Account Number", BANK_INFO.accountNumber);
  row("SWIFT/BIC Code", BANK_INFO.swift);
  row("Branch Name", BANK_INFO.branch);
  row("Preferred Currency", BANK_INFO.currency);

  // ---- Notes (cố định) ----
  sectionHeader("Notes");
  doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
  NOTES_TEXT.forEach((line) => { doc.text(line, L, y); y += 5; });

  return { doc, code: inv.invoice_code };
}

// ---------- Modal xem trước dùng chung ----------
function closeModal() {
  const m = document.getElementById("active-modal");
  if (m) m.remove();
}
function openModal(title, bodyEl, footerButtons) {
  closeModal();
  const overlay = document.createElement("div");
  overlay.id = "active-modal";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(20,26,22,0.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;";
  const box = document.createElement("div");
  box.style.cssText = "background:#fff;border-radius:12px;width:100%;max-width:880px;height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.3);";
  const header = document.createElement("div");
  header.style.cssText = "padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0;";
  header.innerHTML = `<b style="font-size:15px;">${title}</b>`;
  const xBtn = document.createElement("button");
  xBtn.className = "ghost"; xBtn.textContent = "✕ Close"; xBtn.onclick = closeModal;
  header.appendChild(xBtn);
  const body = document.createElement("div");
  body.style.cssText = "flex:1;overflow:hidden;background:#525659;";
  body.appendChild(bodyEl);
  box.appendChild(header);
  box.appendChild(body);
  if (footerButtons && footerButtons.length) {
    const footer = document.createElement("div");
    footer.style.cssText = "padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;";
    footerButtons.forEach((b) => footer.appendChild(b));
    box.appendChild(footer);
  }
  overlay.appendChild(box);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
}

async function previewInvoicePDF(invoiceId) {
  const { doc, code } = await buildInvoiceDoc(invoiceId);
  const blobUrl = doc.output("bloburl");
  const iframe = document.createElement("iframe");
  iframe.src = blobUrl;
  iframe.style.cssText = "width:100%;height:100%;border:none;";

  const downloadBtn = document.createElement("button");
  downloadBtn.className = "primary";
  downloadBtn.textContent = "⬇ Download PDF";
  downloadBtn.onclick = () => doc.save(`${code}.pdf`);

  openModal(`Invoice Preview — ${code}`, iframe, [downloadBtn]);
}

function sheetOrPlaceholder(rows) {
  return rows.length > 0 ? XLSX.utils.json_to_sheet(rows) : XLSX.utils.json_to_sheet([{ Info: "No data yet" }]);
}
function money(cents) {
  return cents === null || cents === undefined ? "" : Number((cents / 100).toFixed(2));
}

  const invoicesRows = cache.invoices.map(i => ({

    "Exchange Rate": p.rate_payout || "", "VND Amount": p.net_amount_vnd || "",
    "Payout Date": p.payout_date || "", Status: p.status,
  }));
  XLSX.utils.book_append_sheet(wb, sheetOrPlaceholder(payoutsRows), "Money Paid to Staff");

  const tasksRows = cache.tasks.map(t => ({
    Job: orderLabel(t.order_id), Task: t.task_name, Staff: staffName(t.staff_id),
    Hours: t.hours ?? "",
    "Client Rate (AUD/hr)": t.client_rate_cents ? money(t.client_rate_cents) : "",
    "Staff Rate (AUD/hr)": t.staff_rate_cents ? money(t.staff_rate_cents) : "",
    "Client Amount (AUD)": money(Math.round((t.hours || 0) * (t.client_rate_cents || 0))),

    Status: t.status, "Progress Claim #": t.billing_cycle_id || "",

function renderPayouts(root) {
  const editing = editingRecord && editingRecord.table === "payouts" ? cache.payouts.find(p => p.payout_id === editingRecord.id) : null;
  if (editing) {
    root.appendChild(warnCard(`Editing the payout for <b>${staffName(editing.staff_id)}</b> — Job ${orderLabel(editing.order_id)}. Changing the amounts here will OVERRIDE the auto-calculated figures — please double-check before updating.`));
    const editCard = formCard("Edit Staff Payout", [
      { key: "gross_amount_aud", label: "Gross Amount (AUD)", type: "number", step:"0.01", default: fromCents(editing.gross_amount_cents) },
      { key: "management_fee_aud", label: "Management Fee (AUD)", type: "number", step:"0.01", default: fromCents(editing.management_fee_cents) },
      { key: "tax_withheld_aud", label: "Tax Withheld 7% (AUD)", type: "number", step:"0.01", default: fromCents(editing.tax_withheld_cents) },
      { key: "net_amount_aud", label: "Net Pay to Staff (AUD)", type: "number", step:"0.01", required: true, default: fromCents(editing.net_amount_cents) },
      { key: "rate_payout", label: "Exchange Rate Applied (AUD/VND)", type: "number", step:"0.01", default: editing.rate_payout },
      { key: "payout_date", label: "Payment Date", type: "date", default: editing.payout_date },
      { key: "status", label: "Status", type: "select", options: ["pending_approval","approved","paid"],
        labels:{pending_approval:"Pending Approval",approved:"Approved",paid:"Paid"}, default: editing.status },
    ], async (data) => {
      data.gross_amount_cents = toCents(data.gross_amount_aud); delete data.gross_amount_aud;
      data.management_fee_cents = toCents(data.management_fee_aud); delete data.management_fee_aud;
      data.tax_withheld_cents = toCents(data.tax_withheld_aud); delete data.tax_withheld_aud;
      data.net_amount_cents = toCents(data.net_amount_aud); delete data.net_amount_aud;
      if (data.rate_payout) data.net_amount_vnd = Math.round((data.net_amount_cents / 100) * parseFloat(data.rate_payout));
      await api("/api/payouts?id=" + editing.payout_id, "PUT", data);
      toast("Payout updated."); editingRecord = null; render();
    }, null, { editing: true, submitLabel: "Update", onCancel: () => { editingRecord = null; render(); } });
    root.appendChild(editCard);

    // Ô hiển thị số tiền quy đổi VND, tự cập nhật theo Số tiền thực nhận (AUD) x Tỷ giá
    const netInput = editCard.querySelector('input[name="net_amount_aud"]');
    const rateInput = editCard.querySelector('input[name="rate_payout"]');

    vndBox.style.cssText = "background:var(--accent-soft);border-radius:8px;padding:12px 14px;margin:-6px 0 14px;";
    function updateVndBox() {
      const netAud = parseFloat(netInput.value) || 0;
      const rate = parseFloat(rateInput.value) || 0;
      const vnd = Math.round(netAud * rate);
      vndBox.innerHTML = `<label style="margin-bottom:2px;">Converted Amount (VND) — for staff payment</label>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;color:var(--accent);">${formatVND(vnd)}</div>`;
    }
    netInput.addEventListener("input", updateVndBox);
    rateInput.addEventListener("input", updateVndBox);
    updateVndBox();
    editCard.querySelector(".grid").insertAdjacentElement("afterend", vndBox);
  }

  root.appendChild(filterBar("payouts", {
    placeholder: "Search by staff name, job code…",
    statusOptions: [
      { value: "pending_approval", label: "Pending" }, { value: "approved", label: "Approved" }, { value: "paid", label: "Paid" },
    ],
  }));

  let list = cache.payouts.filter(p => matchesText(filters.payouts.q, staffName(p.staff_id), orderLabel(p.order_id)));
  if (filters.payouts.status) list = list.filter(p => p.status === filters.payouts.status);

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = "<h2>Staff Payouts</h2>";
  if (cache.payouts.length === 0) {
    card.innerHTML += "<div class='empty'>No payouts yet. Payouts are created automatically when an invoice is marked 'Paid'.</div>";
  } else if (list.length === 0) {
    card.innerHTML += "<div class='empty'>No payouts match your filter.</div>";
  } else {
    const tbl = document.createElement("table");
    tbl.innerHTML = "<thead><tr><th>Staff</th><th>Job</th><th>Gross</th><th>Mgmt Fee</th><th>Tax 7%</th><th>Net Pay</th><th>VND Amount</th><th>Status</th><th></th></tr></thead>";
    const tbody = document.createElement("tbody");
    list.forEach(p => {
      const tr = document.createElement("tr");
      const statusBadge = p.status === "paid" ? "<span class='badge ok'>Paid</span>" : p.status === "approved" ? "<span class='badge muted'>Approved</span>" : "<span class='badge warn'>Pending</span>";
      let actions = "";
      if (p.net_amount_cents === null || p.net_amount_cents === undefined || p.net_amount_cents === 0) {
        actions += `<button class="ghost" data-calc="${p.payout_id}">Calculate</button> `;
      }
      if (p.status === "pending_approval") actions += `<button class="primary" data-approve="${p.payout_id}">Approve</button> `;
      if (p.status === "approved") actions += `<button class="ghost" data-pay="${p.payout_id}">Mark as Paid</button> `;
      actions += `<button class="ghost" data-edit="${p.payout_id}">Edit</button>`;
      tr.innerHTML = `<td>${staffName(p.staff_id)}</td><td>${orderLabel(p.order_id)}</td>

        <td class="money">${aud(p.management_fee_cents)}</td>
        <td class="money">${aud(p.tax_withheld_cents)}</td>

        <td class="money">${formatVND(p.net_amount_vnd)}</td>
        <td>${statusBadge}</td><td class="actions-cell">${actions}</td>`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    tbl.addEventListener("click", async (e) => {
      const calcId = e.target.getAttribute("data-calc");
      const approveId = e.target.getAttribute("data-approve");
      const payId = e.target.getAttribute("data-pay");
      const editId = e.target.getAttribute("data-edit");
      try {
        if (calcId) { await api("/api/calc-payout", "POST", { payout_id: parseInt(calcId) }); toast("Calculation complete — please review before approving."); render(); }
        if (approveId) { await api("/api/payouts?id=" + approveId, "PUT", { status: "approved" }); toast("Approved."); render(); }
        if (payId) { await api("/api/payouts?id=" + payId, "PUT", { status: "paid", payout_date: new Date().toISOString().slice(0,10) }); toast("Marked as paid."); render(); }
        if (editId) { editingRecord = { table: "payouts", id: parseInt(editId) }; render(); }
      } catch (err) { toast(err.message, true); }
    });
    card.appendChild(tbl);
  }
  root.appendChild(card);
  root.appendChild(infoNote("Amounts shown are suggestions based on the agreed formula — please verify before approving, as this is real financial data. Use 'Edit' to adjust manually if the auto-calculation doesn't match reality."));
}

// ---------- BÁO CÁO ----------
function firstDayOfMonth() {
  const d = new Date(); d.setDate(1);
  return d.toISOString().slice(0,10);
}
async function renderReports(root) {
  const backupCard = document.createElement("div");
  backupCard.className = "card";
  backupCard.innerHTML = `<h2>💾 Data Backup & Reports</h2>
    <p style="font-size:13.5px;color:var(--text-soft);margin:0 0 12px;">
      Download a full copy of your data to keep on your computer or Google Drive — separate from Cloudflare.
      Recommended: do this weekly, and before making any major changes to the software.
    </p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="primary" id="download-excel-btn">📊 Download Excel Report (.xlsx)</button>
      <button class="ghost" id="download-backup-btn">Download Raw Backup (JSON)</button>
    </div>`;
  root.appendChild(backupCard);
  backupCard.querySelector("#download-backup-btn").addEventListener("click", async () => {
    try {
      toast("Preparing backup…");
      const data = await api("/api/backup-all");
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `ecofree-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      toast("Backup downloaded.");
    } catch (err) { toast(err.message, true); }
  });
  backupCard.querySelector("#download-excel-btn").addEventListener("click", () => {
    try { toast("Preparing Excel file…"); exportExcelReport(); toast("Excel file downloaded."); }
    catch (err) { toast(err.message, true); }
  });

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = "<h2>Date Filter</h2>";
  const filterRow = document.createElement("div");
  filterRow.className = "grid";
  filterRow.innerHTML = `
    <div><label>From</label><input type="date" id="rep-from" value="${firstDayOfMonth()}"></div>
    <div><label>To</label><input type="date" id="rep-to" value="${new Date().toISOString().slice(0,10)}"></div>
  `;
  card.appendChild(filterRow);
  const btn = document.createElement("button");
  btn.className = "primary"; btn.textContent = "View Report";
  card.appendChild(btn);
  root.appendChild(card);

  const resultZone = document.createElement("div");
  root.appendChild(resultZone);

  async function loadReport() {
    const from = document.getElementById("rep-from").value;
    const to = document.getElementById("rep-to").value;
    resultZone.innerHTML = "<div class='empty'>Calculating…</div>";
    try {
      const r = await api(`/api/report?from=${from}&to=${to}`);
      resultZone.innerHTML = "";

      const c1 = document.createElement("div");
      c1.className = "card";
      c1.innerHTML = `<h2>💰 Net Cash Flow (${from} → ${to})</h2>
        <table>
          <tbody>
            <tr><td>Revenue Received from Clients</td><td class="money">${aud(r.revenue_received_cents)}</td></tr>
            <tr><td>Ecofree Management Fee Retained</td><td class="money">${aud(r.management_fee_cents)}</td></tr>
            <tr><td>Total Staff Payouts Paid</td><td class="money">${aud(r.staff_paid_cents)}</td></tr>
            <tr><td>7% Tax Fund Withheld (held for staff)</td><td class="money">${aud(r.tax_fund_cents)}</td></tr>
            <tr><td><b>May's Net Accumulated Cash Flow</b></td><td class="money"><b>${aud(r.net_cashflow_cents)}</b></td></tr>
          </tbody>
        </table>`;
      resultZone.appendChild(c1);

      const c2 = document.createElement("div");
      c2.className = "card";
      c2.innerHTML = "<h2>⚠️ Bad Debt Risk</h2>";
      if (r.bad_debt_list.length === 0) {
        c2.innerHTML += "<div class='empty'>No bad debt cases.</div>";
      } else {
        const rows = r.bad_debt_list.map(b => `<tr>
          <td>${b.order_code}</td><td>${b.company_name}</td><td>${b.staff_name}</td>
          <td class="money">${aud(b.net_amount_cents)}</td>
        </tr>`).join("");
        c2.innerHTML += `<table><thead><tr><th>Job</th><th>Client</th><th>Supported Staff</th><th>Amount Subsidized by May</th></tr></thead><tbody>${rows}</tbody></table>`;
      }
      resultZone.appendChild(c2);
    } catch (err) {
      resultZone.innerHTML = "<div class='card'>" + err.message + "</div>";
    }
  }
  btn.addEventListener("click", loadReport);
  loadReport();
}

// ---------- HELPERS: FORM & UI ----------
function formCard(title, fields, onSubmit, extraCheckboxes, options) {
  options = options || {};
  const card = document.createElement("div");
  card.className = "card";
  if (options.editing) card.style.borderColor = "var(--accent)";
  card.innerHTML = `<h2>${title}</h2>`;
  const form = document.createElement("form");
  const grid = document.createElement("div");
  grid.className = "grid";
  fields.forEach(f => {
    const wrap = document.createElement("div");
    let inputHtml;
    if (f.type === "select") {
      const opts = f.options.map(o => `<option value="${o}" ${String(f.default)===String(o)?"selected":""}>${(f.labels && f.labels[o]) || o}</option>`).join("");
      inputHtml = `<select name="${f.key}" ${f.required?"required":""}>${opts}</select>`;
    } else if (f.type === "textarea") {
      wrap.style.gridColumn = "1 / -1";
      inputHtml = `<textarea name="${f.key}" rows="3" style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:14px;font-family:inherit;resize:vertical;" ${f.required?"required":""}>${f.default!==undefined && f.default!==null?f.default:""}</textarea>`;
    } else {
      inputHtml = `<input type="${f.type}" name="${f.key}" ${f.step?`step="${f.step}"`:""} ${f.min!==undefined?`min="${f.min}"`:""} ${f.max!==undefined?`max="${f.max}"`:""} ${f.required?"required":""} value="${f.default!==undefined && f.default!==null?f.default:""}">`;
    }
    wrap.innerHTML = `<label>${f.label}${f.required?" *":""}</label>${inputHtml}`;
    grid.appendChild(wrap);
  });
  form.appendChild(grid);
  if (extraCheckboxes) {
    extraCheckboxes.forEach(cb => {
      const row = document.createElement("div");
      row.className = "checkbox-row";
      row.innerHTML = `<input type="checkbox" name="${cb.key}" id="${cb.key}" ${cb.checked?"checked":""}><label for="${cb.key}" style="margin:0;">${cb.label}</label>`;
      form.appendChild(row);
    });
  }
  const btnRow = document.createElement("div");
  btnRow.style.display = "flex"; btnRow.style.gap = "8px"; btnRow.style.marginTop = "6px";
  const submitBtn = document.createElement("button");
  submitBtn.type = "submit"; submitBtn.className = "primary"; submitBtn.textContent = options.submitLabel || "Save";
  btnRow.appendChild(submitBtn);
  if (options.onCancel) {
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button"; cancelBtn.className = "ghost"; cancelBtn.textContent = "Cancel";
    cancelBtn.onclick = options.onCancel;
    btnRow.appendChild(cancelBtn);
  }
  form.appendChild(btnRow);
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const data = {};
    fields.forEach(f => { const v = fd.get(f.key); if (v !== null && v !== "") data[f.key] = v; });
    if (extraCheckboxes) extraCheckboxes.forEach(cb => { data[cb.key] = fd.get(cb.key) ? 1 : 0; });
    try { await onSubmit(data); if (!options.editing) form.reset(); }
    catch (err) { toast(err.message, true); }
  });
  card.appendChild(form);
  return card;
}
function warnCard(msg) {
  const d = document.createElement("div");
  d.className = "card";
  d.style.borderColor = "var(--warn)";
  d.innerHTML = `<span class="badge warn">Note</span> ${msg}`;
  return d;
}
function infoNote(msg) {
  const d = document.createElement("div");
  d.style.color = "var(--text-soft)"; d.style.fontSize = "13px"; d.style.marginTop = "-8px";
  d.textContent = msg;
  return d;
}

render();
</script>
